<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="dp-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="dp-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c4b5fd" />
    </linearGradient>
  </defs>
  
  <!-- Outer squircle container -->
  <rect width="40" height="40" rx="10" fill="url(#dp-gradient)" />
  <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

  <!-- Pulse waveform -->
  <path d="M8 20 L12 20 L15.5 12 L20 28 L24.5 15 L27.5 22 L29.5 20 L32 20" 
        stroke="url(#dp-pulse)" 
        stroke-width="2.75" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Pulse peak nodes -->
  <circle cx="15.5" cy="12" r="1.5" fill="#38bdf8" />
  <circle cx="20" cy="28" r="1.5" fill="#ffffff" />
  <circle cx="24.5" cy="15" r="1.5" fill="#c4b5fd" />
</svg>
